[project]
name = "portfolio-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "uria", email = "uria1480@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "gradio>=6.31.0",
    "openai>=3.42.1",
    "pandas<3",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.2",
    "python-bidi>=0.6.12",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
    "yfinance>=1.8.0",
]

[project.scripts]
portfolio-copilot = "portfolio_copilot:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
